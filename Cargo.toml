[package]
name = "rxiu"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "rxiu"
path = "src/main.rs"

[[bin]]
name = "rxiu-daemon"
path = "src/bin/rxiu-daemon.rs"

[dependencies]
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cbor4ii = { version = "0.3", features = ["serde1", "use_std"] }
dirs = "5.0"
thiserror = "1.0"
ratatui = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros", "fs", "signal"] }
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.libp2p]
version = "0.54"
features = [
    "tokio",
    "mdns",
    "request-response",
    "noise",
    "tcp",
    "yamux",
    "macros",
    "cbor",
]
